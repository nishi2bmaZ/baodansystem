<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>后台管理 · 团队任务报单</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin { display:flex; min-height:100vh; }
    .sidebar { width:200px; background:#1f2d3d; color:#cfd8e3; flex-shrink:0; display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; z-index:50; }
    .sidebar .brand { padding:18px 16px; font-size:17px; font-weight:700; color:#fff; border-bottom:1px solid #2c3e50; line-height:1.4; }
    .sidebar .brand small { font-size:12px; font-weight:400; color:#7f8ea3; }
    .sidebar nav { flex:1; padding:8px 0; overflow-y:auto; }
    .nav-item { padding:13px 18px; font-size:15px; cursor:pointer; color:#cfd8e3; border-left:3px solid transparent; }
    .nav-item:hover { background:#26384c; }
    .nav-item.active { background:#C7A14A; color:#fff; border-left-color:#E0C078; font-weight:600; }
    .side-foot { padding:12px 16px; font-size:12px; color:#7f8ea3; border-top:1px solid #2c3e50; }
    .side-foot .logout { color:#ff7875; cursor:pointer; margin-top:4px; display:inline-block; }
    .content { flex:1; margin-left:200px; background:#f5f6f8; min-height:100vh; }
    .content-head { height:52px; display:flex; align-items:center; padding:0 16px; background:#fff; border-bottom:1px solid #ebedf0; font-size:16px; font-weight:600; position:sticky; top:0; z-index:40; }
    .page-body { padding:16px; }
    .hamburger { display:none; margin-right:12px; font-size:22px; cursor:pointer; line-height:1; }
    .overlay { display:none; }
    .tree { list-style:none; padding-left:18px; margin:6px 0; }
    .tree li { padding:4px 0; font-size:14px; }
    .tree .tag { font-size:12px; margin-right:6px; }
    .rel-info { background:#FBF4E2; border:1px solid #E2D2A8; border-radius:8px; padding:10px 12px; margin-top:8px; }
    .rel-info .title { font-size:15px; margin-bottom:6px; color:#B0862C; }
    .rel-info .kv { display:flex; padding:3px 0; font-size:14px; border-bottom:1px dashed #ECE7DC; }
    .rel-info .kv:last-child { border-bottom:none; }
    .rel-info .k { width:96px; color:#666; flex-shrink:0; }
    .rel-info .v { flex:1; word-break:break-all; }
    .tnode { background:#fff; border:1px solid #ebedf0; border-radius:8px; margin:6px 0; padding:8px 10px; }
    .tnode.located { border-color:#C7A14A; box-shadow:0 0 0 2px rgba(199,161,74,.20); }
    .tnode-head { display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:14px; }
    .tog { cursor:pointer; color:#C7A14A; font-weight:700; width:16px; text-align:center; user-select:none; }
    .tog-empty { visibility:hidden; }
    .temail { font-weight:600; }
    .tphone { color:#888; font-size:12px; }
    .tstats { margin-left:auto; color:#B0862C; font-size:12px; }
    .tchildren { margin-top:2px; }

    /* ===== 模板配置（优化版 UI） ===== */
    .tpl-wrap { max-width: 600px; margin: 0 auto; }
    .tpl-sec { background:#fff; border:1px solid rgba(226,210,168,.45); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(120,96,40,.05); }
    .tpl-sec-title { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:#2B2620; margin-bottom:4px; }
    .tpl-num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:#C7A14A; color:#fff; font-size:12px; font-weight:600; flex-shrink:0; }
    .tpl-count { margin-left:auto; font-size:12px; font-weight:400; color:#9A9183; background:#FBF4E2; padding:2px 9px; border-radius:10px; }
    .tpl-tip { font-size:12px; color:#9A9183; line-height:1.65; background:#FBF4E2; border-radius:8px; padding:8px 10px; margin:8px 0 14px; }
    .field-card { border:1px solid #ECE7DC; border-radius:12px; padding:12px; margin-bottom:12px; background:#FCFBF8; transition:border-color .15s ease, box-shadow .15s ease; }
    .field-card:hover { border-color:#E2D2A8; box-shadow:0 2px 8px rgba(150,120,50,.06); }
    .fc-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .fc-badge { width:20px; height:20px; border-radius:50%; background:#2B2620; color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .fc-type-pill { font-size:12px; color:#B0862C; background:#FBF4E2; padding:2px 9px; border-radius:10px; }
    .fc-del { margin-left:auto; font-size:13px; color:#E23A3A; cursor:pointer; padding:4px 6px; border-radius:6px; }
    .fc-del:hover { background:#FBE7E7; }
    .fc-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fc-grid .field { margin-bottom:10px; }
    .fc-toggle { display:flex; align-items:center; gap:8px; padding-top:10px; }
    .fc-toggle input { width:18px; height:18px; accent-color:#C7A14A; }
    .fc-empty { text-align:center; color:#9A9183; font-size:13px; padding:18px 0; }
    @media (max-width:520px){ .fc-grid { grid-template-columns:1fr; } }
    .tpl-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .chip { display:inline-block; font-size:12px; color:#6B6256; background:#F3E6C5; border-radius:8px; padding:3px 10px; }
    .tpl-item { margin-bottom:10px; }
    .tpl-item .sub { margin-top:6px; }
    /* 提交审核：筛选/批量工具条 + 列表 + 详情 */
    .rev-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .rev-filter { width:auto; min-width:160px; }
    .rev-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#FBF4E2; border:1px solid #E2D2A8; border-radius:12px; padding:10px 14px; }
    .rev-bar .count { font-size:13px; color:#6B6256; margin-right:auto; }
    .rev-list { display:flex; flex-direction:column; gap:10px; }
    .rev-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid rgba(226,210,168,.45); border-radius:12px; padding:12px 14px; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
    .rev-row:hover { border-color:#E2D2A8; box-shadow:0 2px 8px rgba(150,120,50,.06); }
    .rev-row.sel { border-color:var(--gold); box-shadow:0 0 0 2px rgba(199,161,74,.15); }
    .rev-check { width:18px; height:18px; accent-color:var(--gold); flex-shrink:0; cursor:pointer; }
    .rev-main { flex:1; min-width:0; }
    .rev-top { display:flex; align-items:center; gap:8px; }
    .rev-id { font-weight:600; color:#2B2620; }
    .rev-meta { color:#9A9183; font-size:13px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rev-detail .img-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .rev-detail .img-grid img { width:88px; height:88px; object-fit:cover; border-radius:8px; border:1px solid #ECE7DC; }
    .rev-detail .field-rows .kv { border-bottom:1px dashed #ECE7DC; }
    /* 修改会员弹窗 */
    .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
    .modal { background:#fff; width:100%; max-width:480px; border-radius:12px; overflow:hidden; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #ebedf0; font-size:16px; font-weight:600; }
    .modal-head .close { font-size:22px; cursor:pointer; color:#888; line-height:1; }
    .modal-body { padding:14px 16px; max-height:74vh; overflow:auto; }
    .modal-sec { border:1px solid #ebedf0; border-radius:10px; padding:12px; margin-bottom:12px; }
    .modal-sec .sec-title { font-size:15px; font-weight:600; margin-bottom:10px; color:#1f2d3d; }
    .modal-sec .hint { font-size:12px; color:#888; margin:8px 0 0; }
    .modal .cur-ref { font-size:13px; color:#555; margin-bottom:8px; padding:6px 8px; background:#f7f8fa; border-radius:6px; }
    @media (max-width:768px){
      .sidebar { transform:translateX(-100%); transition:transform .25s; width:190px; }
      .admin.sidebar-open .sidebar { transform:translateX(0); }
      .content { margin-left:0; }
      .hamburger { display:inline-flex; }
      .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:45; }
      .admin.sidebar-open .overlay { display:block; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>

<script>
/* ===================== 基础 ===================== */
const AK_KEY = 'bd_admin_key';
const USER_STATUS_CN = { PENDING:'待审核', ACTIVE:'已通过', DISABLED:'已禁用' };
const SUB_STATUS_CN = { GRABBED:'已抢单', SUBMITTED:'待审核', COMPLETED:'已完成', REJECTED:'驳回' };
const TYPE_CN = { text:'文本', number:'数字', image:'图片', dropdown:'下拉', date:'日期', checkbox:'勾选' };
const MENU_TITLE = { members:'会员管理', templates:'模板配置', publish:'任务发布', review:'提交审核', relation:'关系树' };
let A = { view:'login', menu:'members', templates:[], instances:[], subs:[], curInstanceId:null,
          newStages:[{ title:'', fields:[{key:'',label:'',type:'text',required:false,options:''}], steps:[{label:'',content:'',copyable:false,image:null}] }] };

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function getAK(){ return localStorage.getItem(AK_KEY); }
function setAK(k){ localStorage.setItem(AK_KEY, k); }
function clearAK(){ localStorage.removeItem(AK_KEY); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

async function api(method, path, body){
  const headers = { 'x-admin-key': getAK() };
  const opt = { method, headers };
  if(body!==undefined){ headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((data&&data.message)||('请求失败('+res.status+')')); }
  return data;
}
async function copyText(text){
  const t = String(text||'');
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); toast('已复制到剪贴板'); return; }
  }catch(e){}
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制到剪贴板'); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
function autoResize(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
function normalizeContent(s){
  return String(s==null?'').replace(/\r\n/g,'\n').replace(/[ \t]+$/gm,'').replace(/^\n+|\n+$/g,'').replace(/\n{3,}/g,'\n\n');
}
function bindAutoResize(root){
  root.querySelectorAll('textarea.auto-height').forEach(ta=>{
    ta.addEventListener('input', ()=>autoResize(ta));
    autoResize(ta);
  });
}

/* ===================== 启动 / 登录 ===================== */
function render(){
  const app=$('#app');
  if(A.view==='login'){ renderLogin(app); return; }
  renderAdmin(app);
}
function renderLogin(app){
  app.innerHTML = `
  <div class="auth-box">
    <div class="logo">团队任务报单</div>
    <div class="slogan">管理后台 · 请输入管理密钥</div>
    <div class="card">
      <div class="field"><label>管理密钥<span class="req">*</span></label>
        <input type="text" id="ak" placeholder="默认 admin123"></div>
      <button class="btn" id="loginBtn">进入后台</button>
    </div>
  </div>`;
  $('#loginBtn').onclick = doLogin;
}
async function doLogin(){
  const k=$('#ak').value.trim(); if(!k){ toast('请输入密钥'); return; }
  try{ setAK(k); await api('GET','/admin/users?status=PENDING'); A.view='admin'; render(); }
  catch(e){ clearAK(); toast('密钥错误：'+e.message); }
}

/* ===================== 后台主框架（左菜单 + 右内容） ===================== */
function renderAdmin(app){
  app.innerHTML = `
  <div class="admin" id="adminRoot">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar">
      <div class="brand">团队任务报单<br><small>管理后台</small></div>
      <nav>
        <div class="nav-item ${A.menu==='members'?'active':''}" data-menu="members">会员管理</div>
        <div class="nav-item ${A.menu==='templates'?'active':''}" data-menu="templates">模板配置</div>
        <div class="nav-item ${A.menu==='publish'?'active':''}" data-menu="publish">任务发布</div>
        <div class="nav-item ${A.menu==='review'?'active':''}" data-menu="review">提交审核</div>
        <div class="nav-item ${A.menu==='relation'?'active':''}" data-menu="relation">关系树</div>
      </nav>
      <div class="side-foot">管理密钥已登录<div class="logout" id="logoutBtn">退出登录</div></div>
    </aside>
    <main class="content">
      <div class="content-head"><span class="hamburger" id="hamburger">☰</span><span id="pageTitle">${MENU_TITLE[A.menu]}</span></div>
      <div id="pageBody" class="page-body"></div>
    </main>
  </div>`;
  app.querySelectorAll('.nav-item').forEach(t=> t.onclick=()=> setMenu(t.dataset.menu));
  $('#logoutBtn').onclick = ()=>{ clearAK(); A.view='login'; render(); };
  $('#hamburger').onclick = ()=> $('#adminRoot').classList.toggle('sidebar-open');
  $('#overlay').onclick = ()=> $('#adminRoot').classList.remove('sidebar-open');
  setMenu(A.menu, true);
}
function setMenu(menu, silent){
  A.menu = menu;
  $$('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.menu===menu));
  const pt=$('#pageTitle'); if(pt) pt.textContent = MENU_TITLE[menu]||'';
  const body=$('#pageBody'); if(!body) return;
  if(menu==='members') loadMembers();
  else if(menu==='templates') loadTemplates();
  else if(menu==='publish') loadPublish();
  else if(menu==='review') loadReview();
  else if(menu==='relation') loadRelation();
  if(!silent && $('#adminRoot')) $('#adminRoot').classList.remove('sidebar-open');
}

/* ===================== 会员管理 ===================== */
async function loadMembers(){
  const body=$('#pageBody');
  const status = (body.querySelector('#mStatus')||{}).value || 'PENDING';
  const q = (body.querySelector('#mSearch')||{}).value || '';
  let users=[];
  try{ users = await api('GET','/admin/users?status='+encodeURIComponent(status)+'&q='+encodeURIComponent(q)); }catch(e){ toast(e.message); }
  const list = (users||[]).map(u=>`
    <div class="card">
      <div class="title" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap;margin-bottom:4px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${u.name?esc(u.name)+' ':''}${esc(u.email)}
          <span class="tag ${u.status==='ACTIVE'?'approved':u.status==='DISABLED'?'rejected':'pending'}">${USER_STATUS_CN[u.status]||u.status}</span>
          ${u.level?`<span class="tag">${esc(u.level)}</span>`:''}
        </span>
        <div class="m-actions">
          ${u.status!=='ACTIVE' ? `<button class="btn sm" data-approve="${u.id}">通过</button>`:''}
          ${u.status==='ACTIVE' ? `<button class="btn sm danger" data-disable="${u.id}">禁用</button>`:''}
          ${u.status==='DISABLED' ? `<button class="btn sm" data-approve="${u.id}">启用</button>`:''}
          <button class="btn sm ghost" data-edit="${u.id}">修改</button>
        </div>
      </div>
      <div class="sub">手机：${esc(u.phone)} ｜ 上级：${esc(u.referrerEmail||'无')} ｜ 注册：${esc((u.createdAt||'').slice(0,10))}</div>
    </div>`).join('');
  body.innerHTML = `
    <div class="card">
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="margin:0"><label>状态</label>
          <select id="mStatus">
            <option value="PENDING">待审核</option>
            <option value="ACTIVE">已通过</option>
            <option value="DISABLED">已禁用</option>
            <option value="">全部</option>
          </select></div>
        <div class="field" style="margin:0;flex:1;min-width:140px"><label>搜索(邮箱/手机号)</label><input type="text" id="mSearch" placeholder="输入关键字"></div>
        <button class="btn sm" id="mSearchBtn">查询</button>
        <button class="btn sm ghost" id="mRefresh">刷新</button>
      </div>
    </div>
    ${list || '<div class="card center muted">暂无会员</div>'}`;
  const ss=body.querySelector('#mStatus'); if(ss) ss.value=status;
  const sb=body.querySelector('#mSearchBtn'); if(sb) sb.onclick=()=>loadMembers();
  const rb=body.querySelector('#mRefresh'); if(rb) rb.onclick=()=>loadMembers();
  body.querySelectorAll('[data-approve]').forEach(b=> b.onclick=()=>memberAction(b.dataset.approve,'approve'));
  body.querySelectorAll('[data-disable]').forEach(b=> b.onclick=()=>memberAction(b.dataset.disable,'disable'));
  body.querySelectorAll('[data-edit]').forEach(b=> b.onclick=()=>openEditModal(b.dataset.edit));
}
async function memberAction(id, action){
  try{ await api('POST','/admin/users/'+id+'/review',{action}); toast(action==='approve'?'已通过/启用':'已禁用'); loadMembers(); }
  catch(e){ toast(e.message); }
}

/* ===================== 修改会员（资料 / 推荐关系 / 密码） ===================== */
let EDIT = { id:null, user:null, newReferrerId:null };

async function openEditModal(id){
  let u;
  try{ u = await api('GET','/admin/users/'+id); }catch(e){ toast(e.message); return; }
  EDIT = { id, user:u, newReferrerId:null };
  renderEditModal();
}
function renderEditModal(){
  const u = EDIT.user;
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'editMask';
  mask.innerHTML = `
    <div class="modal">
      <div class="modal-head"><span>修改会员 · ${esc(u.email)}</span><span class="close" id="editClose">×</span></div>
      <div class="modal-body">
        <div class="modal-sec">
          <div class="sec-title">① 基本资料</div>
          <div class="field"><label>姓名</label><input type="text" id="eName" value="${esc(u.name||'')}" placeholder="选填"></div>
          <div class="field"><label>手机号</label><input type="text" id="ePhone" value="${esc(u.phone||'')}"></div>
          <div class="field"><label>等级</label>
            <select id="eLevel">
              ${['普通会员','银卡会员','金卡会员','钻石会员'].map(l=>`<option ${u.level===l?'selected':''}>${l}</option>`).join('')}
            </select></div>
          <button class="btn sm" id="eSaveProfile">保存资料</button>
        </div>
        <div class="modal-sec">
          <div class="sec-title">② 推荐关系</div>
          <div class="cur-ref" id="eCurRef">当前上级：${esc(u.referrerEmail||'无（顶层）')}${u.referrerId?(' (#'+u.referrerId+')'):''}</div>
          <div class="field"><label>新上级（邮箱/手机号）</label>
            <div class="row" style="gap:8px">
              <input type="text" id="eRefQ" placeholder="输入关键字搜索">
              <button class="btn sm ghost" id="eRefSearch">搜索</button>
            </div>
          </div>
          <div id="eRefOut" class="mt8"></div>
          <label style="font-size:13px;display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="eTop"> 设为顶层（无上级）</label>
          <div class="hint">调整上级会联动重算整棵推荐树，并记录调整日志。</div>
          <button class="btn sm" id="eSaveRef">保存关系调整</button>
        </div>
        <div class="modal-sec">
          <div class="sec-title">③ 登录密码</div>
          <div class="field"><label>新密码</label><input type="text" id="ePwd" placeholder="至少 6 位"></div>
          <button class="btn sm" id="eSavePwd">重置密码</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(mask);
  $('#editClose').onclick = closeEditModal;
  mask.onclick = (e)=>{ if(e.target===mask) closeEditModal(); };
  $('#eSaveProfile').onclick = saveProfile;
  $('#eSavePwd').onclick = savePassword;
  $('#eRefSearch').onclick = searchReferrer;
  $('#eSaveRef').onclick = saveReferrer;
  $('#eTop').onchange = ()=>{ if($('#eTop').checked){ EDIT.newReferrerId=null; $('#eRefOut').innerHTML=''; } };
}
function closeEditModal(){
  const m=document.getElementById('editMask'); if(m) m.remove();
}
async function saveProfile(){
  const name=$('#eName').value.trim(), phone=$('#ePhone').value.trim(), level=$('#eLevel').value;
  if(!phone){ toast('手机号不能为空'); return; }
  try{ await api('POST','/admin/users/'+EDIT.id,{name,phone,level}); toast('资料已更新'); loadMembers(); }
  catch(e){ toast(e.message); }
}
async function savePassword(){
  const password=$('#ePwd').value;
  if(!password||password.length<6){ toast('密码至少 6 位'); return; }
  try{ await api('POST','/admin/users/'+EDIT.id+'/password',{password}); toast('密码已重置'); $('#ePwd').value=''; }
  catch(e){ toast(e.message); }
}
async function searchReferrer(){

function renderStageEditor(body){
  const wrap = body.querySelector('#stageList');
  const counter = body.querySelector('#stCount');
  if(counter) counter.textContent = A.newStages.length + ' 个阶段';
  if(!A.newStages.length){
    wrap.innerHTML = '<div class="fc-empty">还没有阶段，点「+ 添加阶段」开始</div>';
    return;
  }
  wrap.innerHTML = A.newStages.map((s,si)=> stageCardHtml(si)).join('');
  // 阶段标题
  wrap.querySelectorAll('[data-stagekey]').forEach(inp=>{
    inp.onchange=()=>{ const si=+inp.dataset.stagekey; A.newStages[si].title=inp.value; };
  });
  // 字段输入
  wrap.querySelectorAll('[data-fk]').forEach(inp=>{
    inp.onchange=()=>{ const [si,fi]=inp.dataset.fk.split(':').map(Number); const k=inp.dataset.f;
      A.newStages[si].fields[fi][k] = (k==='required')?inp.checked:inp.value;
      if(k==='type'){ const opt=inp.closest('.field-card').querySelector('[data-optwrap]'); opt.style.display=inp.value==='dropdown'?'':'none'; const pill=inp.closest('.field-card').querySelector('[data-typepill]'); if(pill) pill.textContent=TYPE_CN[inp.value]||inp.value; }
    };
  });
  // 步骤输入
  wrap.querySelectorAll('[data-sk2]').forEach(inp=>{
    inp.onchange=()=>{ const [si,ki]=inp.dataset.sk2.split(':').map(Number); const k=inp.dataset.s;
      A.newStages[si].steps[ki][k] = (k==='copyable')?inp.checked:inp.value;
    };
  });
  // 步骤参考图片上传（后台专用 /upload/admin）
  wrap.querySelectorAll('[data-sk2][data-s="imageFile"]').forEach(inp=>{
    inp.onchange=async ()=>{
      const [si,ki]=inp.dataset.sk2.split(':').map(Number);
      const file=inp.files[0]; if(!file) return;
      const prev=inp.closest('.field').querySelector('[data-stepimg]');
      const oldHtml=prev.innerHTML;
      prev.innerHTML='<div class="muted" style="font-size:12px">上传中…</div>';
      try{
        const fd=new FormData(); fd.append('file',file);
        const res=await fetch('/upload/admin',{ method:'POST', headers:{'x-admin-key':getAK()}, body:fd });
        const d=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(d.message||('上传失败('+res.status+')'));
        A.newStages[si].steps[ki].image=d.url;
        prev.innerHTML=`<div class="step-img-prev"><img src="${esc(d.url)}"><button type="button" class="step-img-del" data-delimg="${si}:${ki}">✕ 移除</button></div>`;
        const nb=prev.querySelector('[data-delimg]');
        if(nb) nb.onclick=()=>{ A.newStages[si].steps[ki].image=null; prev.innerHTML=''; };
        toast('图片已上传');
      }catch(e){ prev.innerHTML=oldHtml; toast(e.message); }
    };
  });
  wrap.querySelectorAll('[data-delstage]').forEach(b=> b.onclick=()=>{ A.newStages.splice(+b.dataset.delstage,1); if(!A.newStages.length) A.newStages.push(newStage()); renderStageEditor(body); });
  wrap.querySelectorAll('[data-addfield]').forEach(b=> b.onclick=()=>{ const si=+b.dataset.addfield; A.newStages[si].fields.push(newField()); renderStageEditor(body); });
  wrap.querySelectorAll('[data-delfield]').forEach(b=> b.onclick=()=>{ const [si,fi]=b.dataset.delfield.split(':').map(Number); A.newStages[si].fields.splice(fi,1); if(!A.newStages[si].fields.length) A.newStages[si].fields.push(newField()); renderStageEditor(body); });
  wrap.querySelectorAll('[data-addstep]').forEach(b=> b.onclick=()=>{ const si=+b.dataset.addstep; A.newStages[si].steps.push(newStep()); renderStageEditor(body); });
  wrap.querySelectorAll('[data-delstep]').forEach(b=> b.onclick=()=>{ const [si,ki]=b.dataset.delstep.split(':').map(Number); A.newStages[si].steps.splice(ki,1); if(!A.newStages[si].steps.length) A.newStages[si].steps.push(newStep()); renderStageEditor(body); });
  bindAutoResize(wrap);
}
async function saveTemplate(){
  const name=$('#tplName').value.trim(), status=$('#tplStatus').value, description=$('#tplDesc').value.trim();
  if(!name){ toast('请填写模板名称'); return; }
  const stages=A.newStages.map(st=>({
    title: st.title.trim(),
    fields: st.fields.map(f=>({
      key:f.key.trim(), label:f.label.trim(), type:f.type, required:!!f.required,
      options: f.type==='dropdown' ? f.options.split(',').map(s=>s.trim()).filter(Boolean) : undefined
    })).filter(f=>f.key&&f.label),
    steps: st.steps.map(s=>({ label:s.label.trim(), content:s.content||'', copyable:!!s.copyable, image:s.image||null })).filter(s=>s.label)
  }));
  if(!stages.length){ toast('至少添加一个阶段'); return; }
  for(let si=0;si<stages.length;si++){
    if(!stages[si].title){ toast('第'+(si+1)+'阶段标题必填'); return; }
    if(!stages[si].fields.length){ toast('第'+(si+1)+'阶段至少需要一个字段'); return; }
    for(const f of stages[si].fields){
      if(!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(f.key)){ toast('第'+(si+1)+'阶段字段key非法：'+f.key); return; }
      if(f.type==='dropdown' && (!f.options||!f.options.length)){ toast('下拉字段「'+f.label+'」需提供选项'); return; }
    }
  }
  try{
    await api('POST','/admin/task-template',{name,status,description,stages});
    toast('模板已保存');
    A.newStages=[newStage()];
    loadTemplates();
  }catch(e){ toast(e.message); }
}

async function publish(){
  const templateId=+$('#pTpl').value, title=$('#pTitle').value.trim(), date=$('#pDate').value,
        quota=+$('#pQuota').value;
  if(!templateId||!title||!date||!quota){ toast('请填写标题、日期和名额'); return; }
  const start=$('#pStart').value, end=$('#pEnd').value;
  const payload={ templateId, title, date, quota,
    startTime: start?new Date(start).toISOString():new Date(date+'T00:00:00').toISOString(),
    endTime: end?new Date(end).toISOString():new Date(date+'T23:59:59').toISOString() };
  try{ await api('POST','/admin/task-instance',payload); toast('任务已发布'); loadPublish(); }
  catch(e){ toast(e.message); }
}

        </div>
      </div>
      <div class="tpl-sec" style="margin-top:18px">
        <div class="tpl-sec-title"><span class="tpl-num">2</span>提交记录 <span class="tpl-count">${subs.length}</span></div>
        <div class="rev-list" id="rList">${list}</div>
      </div>
    </div>`;
  const sel=body.querySelector('#rInst');
  sel.onchange=()=>{ A.curInstanceId = sel.value? +sel.value : null; fetchSubs().then(()=>renderReview(body)); };
  body.querySelector('#rRefresh').onclick=()=>{ fetchSubs().then(()=>renderReview(body)); };
  body.querySelector('#rAll').onchange=(e)=>{ const on=e.target.checked; (A.subs||[]).forEach(s=>{ if(on) A.selIds.add(s.id); else A.selIds.delete(s.id); }); renderReview(body); };
  body.querySelector('#rExport').onclick=exportSelected;
  $$('#rList .rev-row').forEach(row=>{
    const id=+row.dataset.id;
    const cb=row.querySelector('.rev-check');
    cb.onclick=(e)=>{ e.stopPropagation(); if(cb.checked) A.selIds.add(id); else A.selIds.delete(id); updateCount(); row.classList.toggle('sel',cb.checked); };
    row.onclick=()=> showDetail(id);
  });
  updateCount();
}
function revRowHtml(s){
  const sel = A.selIds && A.selIds.has(s.id);
  const stcn = SUB_STATUS_CN[s.status]||s.status;
  const stcls = s.status==='COMPLETED'?'completed':s.status==='REJECTED'?'rejected':'pending';
  const time = s.submittedAt ? s.submittedAt.replace('T',' ').slice(0,16) : '—';
  const member = s.user? s.user.email : '—';
  const title = s.instance? s.instance.title : '—';
  const total = s.stageCount||1;
  const cur = s.status==='COMPLETED'? total : ((s.stageIndex||0)+1);
  const stageTxt = s.status==='COMPLETED'? '全部完成' : ('第 '+cur+'/'+total+' 阶段');
  return `<div class="rev-row ${sel?'sel':''}" data-id="${s.id}">
    <input type="checkbox" class="rev-check" ${sel?'checked':''}>
    <div class="rev-main">
      <div class="rev-top"><span class="rev-id">#${s.id}</span><span class="tag ${stcls}">${stcn}</span></div>
      <div class="rev-meta">${esc(title)} ｜ ${esc(member)} ｜ ${stageTxt} ｜ ${esc(time)}</div>
    </div>
  </div>`;
}
function updateCount(){
  const el=$('#rCount'); if(el) el.textContent='已选 '+(A.selIds? A.selIds.size:0)+' 项';
}
async function showDetail(id){
  const s=(A.subs||[]).find(x=>x.id===id); const body=$('#pageBody');
  if(!s){ toast('记录不存在'); return; }
  const stages=(s.instance&&s.instance.template&&s.instance.template.stages)||[];
  const count=stages.length||1;
  const completed = s.status==='COMPLETED';
  const barIdx = completed ? count : (s.stageIndex||0);
  let bar='';
  for(let k=0;k<count;k++){ const cls=completed?'done':(k<barIdx?'done':(k===barIdx?'cur':'')); bar+=`<span class="dot ${cls}"><span class="n">${k+1}</span></span>`; if(k<count-1) bar+=`<span class="arrow">›</span>`; }

  const sd = s.stagesData||{};
  const stageBlocks = stages.map((st,idx)=>{
    const d=sd[idx]||{}; const data=d.data||{};
    const shownKeys = new Set();
    const fieldRows = (st.fields||[]).map(f=>{
      shownKeys.add(f.key);
      let v=data[f.key];
      if(f.type==='checkbox') v=v?'是':'否';
      if(f.type==='image'&&v) v=`<a href="${esc(v)}" target="_blank"><img class="thumb" src="${esc(v)}"></a>`;
      return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">${v===''||v==null?'-':v}</span></div>`;
    }).join('');
    // 兜底：把提交数据里、模板当前没有的字段也列出来，确保会员填的内容不丢失
    const extraKeys = Object.keys(data).filter(k=>!shownKeys.has(k));
    const extraRows = extraKeys.map(k=>{
      let v=data[k];
      if(typeof v==='string' && /^(https?:\/\/|\/uploads)/.test(v)) v=`<a href="${esc(v)}" target="_blank"><img class="thumb" src="${esc(v)}"></a>`;
      return `<div class="kv"><span class="k">${esc(k)}<span class="muted" style="font-size:11px">（模板外字段）</span></span><span class="v">${v===''||v==null?'-':v}</span></div>`;
    }).join('');
    const rows = fieldRows + extraRows;
    const steps=(st.steps||[]).map(stp=>{
      const clean=normalizeContent(stp.content);
      return `<div class="step"><div class="label">${esc(stp.label)}</div>${clean?`<div class="content">${esc(clean)}</div>`:''}${stp.image?`<div class="step-img"><img src="${esc(stp.image)}" alt="参考图"></div>`:''}${stp.copyable?`<button class="copy-btn" data-copy="${esc(clean)}">📋 一键复制</button>`:''}</div>`;
    }).join('');
    const isCur = !completed && idx===barIdx;
    return `<div class="card" style="margin-bottom:12px">
      <div class="title" style="font-size:15px">第 ${idx+1} 阶段 · ${esc(st.title)}${isCur?' <span class="tag pending">当前</span>':''}</div>
      ${rows||'<div class="muted">（未填写）</div>'}
      ${steps?`<div class="steps-box" style="margin-top:10px"><div class="h">📌 参考步骤</div>${steps}</div>`:''}
    </div>`;
  }).join('');

  const info=[
    ['任务标题', s.instance? s.instance.title : '—'],
    ['模板名称', (s.instance&&s.instance.template)? s.instance.template.name : '—'],
    ['提交人', s.user? (s.user.email+' ｜ '+s.user.phone):'—'],
    ['提交时间', s.submittedAt? s.submittedAt.replace('T',' ').slice(0,19):'—'],
    ['审核时间', s.reviewedAt? s.reviewedAt.replace('T',' ').slice(0,19):'—'],
  ];
  const infoHtml=info.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('');
  const reason = s.status==='REJECTED' && s.rejectReason
    ? `<div class="kv"><span class="k">驳回理由</span><span class="v" style="color:var(--danger)">${esc(s.rejectReason)}</span></div>` : '';
  const actions = s.status==='SUBMITTED'
    ? `<div style="display:flex;gap:10px;margin-top:14px">
         <button class="btn sm" data-approve="${s.id}">${completed?'通过并完成':'通过本阶段'}</button>
         <button class="btn sm danger" data-reject="${s.id}">驳回本阶段</button>
       </div>`
    : `<div class="sub mt8">${s.status==='REJECTED'?'已驳回（会员可重填）':(s.status==='GRABBED'?'待会员填写':'已全部完成')}</div>`;
  body.innerHTML = `
    <div class="tpl-wrap">
      <div class="tpl-sec rev-detail">
        <div class="tpl-sec-title">
          <a href="javascript:;" id="rBack" style="color:var(--gold);text-decoration:none;margin-right:8px">← 返回列表</a>
          #${s.id} <span class="tag ${s.status==='COMPLETED'?'completed':s.status==='REJECTED'?'rejected':'pending'}">${SUB_STATUS_CN[s.status]||s.status}</span>
        </div>
        <div class="field-rows mt8">${infoHtml}${reason}</div>
        <p class="tpl-tip" style="margin:14px 0 8px">阶段进度</p>
        <div class="stage-bar">${bar}</div>
        ${stageBlocks}
        ${actions}
      </div>
    </div>`;
  $('#rBack').onclick=()=> loadReview();
  body.querySelectorAll('[data-copy]').forEach(b=> b.onclick=()=>copyText(b.dataset.copy));
  const ab=body.querySelector('[data-approve]'); if(ab) ab.onclick=()=>review(ab.dataset.approve,'approve');
  const rj=body.querySelector('[data-reject]'); if(rj) rj.onclick=()=>{
    const note=prompt('请输入驳回理由：','不符合要求'); if(note===null) return; review(rj.dataset.reject,'reject',note);
  };
}
async function exportSelected(){
  const ids=[...(A.selIds||[])];
  if(!ids.length){ toast('请先勾选要导出的记录'); return; }
  try{
    const r=await api('POST','/admin/export/selected',{ids});
    toast('已导出 '+r.rowCount+' 条，正在下载');
    window.open(r.url,'_blank');
  }catch(e){ toast(e.message); }
}
async function review(id, action, note){
  try{ await api('POST','/admin/submission/'+id+'/review',{action,note}); toast(action==='approve'?'已通过':'已驳回'); loadReview(); }
  catch(e){ toast(e.message); }
}

/* ===================== 关系树（交互式下钻 + 搜索定位） ===================== */
let TR = { roots:[], open:{}, data:{}, located:null };

async function loadRelation(){
  const body=$('#pageBody');
  body.innerHTML = `
    <div class="card">
      <div class="field"><label>搜索账号（邮箱或手机号）</label>
        <div class="row" style="gap:8px">
          <input type="text" id="relSearch" placeholder="输入关键字，定位账号并展开其关系">
          <button class="btn sm" id="relSearchBtn">查询</button>
        </div>
      </div>
      <div id="relInfo" class="rel-info" style="display:none"></div>
      <div id="relSearchOut" class="mt12"></div>
    </div>
    <div class="title" style="display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:8px 0 4px">
      团队关系树（从顶层第一个账号开始，点击 ▸ 逐层展开下级）
      <div class="m-actions" style="margin-top:0;flex-wrap:nowrap">
        <button class="btn sm" id="relRebuildBtn">重建路径</button>
        <button class="btn sm ghost" id="relRefreshBtn">刷新</button>
      </div>
    </div>
    <div id="treeRoot" class="mt12"><div class="card center muted">加载中…</div></div>`;
  body.querySelector('#relSearchBtn').onclick = doRelSearch;
  body.querySelector('#relSearch').addEventListener('keydown', e=>{ if(e.key==='Enter') doRelSearch(); });
  const rb=body.querySelector('#relRefreshBtn'); if(rb) rb.onclick=()=>loadRoots();
  const reb=body.querySelector('#relRebuildBtn'); if(reb) reb.onclick=async()=>{
    if(!confirm('确定根据当前 referrerId 重建所有人的 path/depth？')) return;
    try{ await api('POST','/admin/relation/rebuild-paths'); toast('路径已重建'); loadRoots(); }
    catch(e){ toast(e.message); }
  };
  await loadRoots();
}

async function loadRoots(){
  const root=$('#treeRoot'); if(!root) return;
  try{
    const data=await api('GET','/admin/relation/roots');
    TR.roots = data.roots||[];
    TR.open={}; TR.data={}; TR.located=null;
    if(!TR.roots.length){ root.innerHTML='<div class="card center muted">暂无账号</div>'; return; }
    renderTree();
    // 自动展开第一个（最早的顶层）账号，满足"从最顶层第一个账号开始展示"
    await toggleNode(TR.roots[0].id, true);
  }catch(e){ root.innerHTML='<div class="card center muted">'+esc(e.message)+'</div>'; }
}

function renderTree(){
  const root=$('#treeRoot'); if(!root) return;
  root.innerHTML = TR.roots.map(n=>renderNode(n,0)).join('');
  bindTree(root);
}
function renderNode(n, level){
  const st=USER_STATUS_CN[n.status]||n.status;
  const stCls = n.status==='ACTIVE'?'approved':n.status==='DISABLED'?'rejected':'pending';
  const isOpen = !!TR.open[n.id];
  const tog = n.hasChildren ? `<span class="tog" data-toggle="${n.id}">${isOpen?'▾':'▸'}</span>` : `<span class="tog tog-empty">·</span>`;
  const kids = (isOpen && TR.data[n.id]) ? `<div class="tchildren">${TR.data[n.id].map(c=>renderNode(c,level+1)).join('')}</div>` : '';
  const isLoc = TR.located===n.id ? ' located':'';
  return `<div class="tnode${isLoc}" data-id="${n.id}" style="margin-left:${level*18}px">
    <div class="tnode-head">
      ${tog}
      <span class="tag ${stCls}">${st}</span>
      <span class="temail">${esc(n.email)}</span>
      <span class="tphone">${esc(n.phone)}</span>
      <span class="tstats">直推 ${n.directCount} ｜ 团队 ${n.teamTotal}</span>
    </div>
    ${kids}
  </div>`;
}
function bindTree(scope){
  scope.querySelectorAll('[data-toggle]').forEach(t=>{
    t.onclick = ()=> toggleNode(+t.dataset.toggle);
  });
}
async function toggleNode(id, forceOpen){
  if(TR.open[id] && !forceOpen){ TR.open[id]=false; renderTree(); return; }
  TR.open[id]=true;
  // 每次展开都重新拉取最新下级，避免调整推荐关系后显示旧数据
  try{
    const d=await api('GET','/admin/relation/children?userId='+id);
    TR.data[id] = d.children||[];
  }catch(e){ toast(e.message); TR.open[id]=false; return; }
  renderTree();
}

async function doRelSearch(){
  const q=$('#relSearch').value.trim();
  const out=$('#relSearchOut');
  if(!q){ out.innerHTML=''; return; }
  try{
    const d=await api('GET','/admin/relation/search?q='+encodeURIComponent(q));
    const rs=d.results||[];
    if(!rs.length){ out.innerHTML='<div class="card center muted">未找到匹配账号</div>'; return; }
    out.innerHTML = rs.map(r=>{
      const st=USER_STATUS_CN[r.status]||r.status;
      const stCls = r.status==='ACTIVE'?'approved':r.status==='DISABLED'?'rejected':'pending';
      return `<div class="card">
        <div class="title">${esc(r.email)} <span class="tag ${stCls}">${st}</span></div>
        <div class="sub">手机：${esc(r.phone)} ｜ 层级 ${r.depth} ｜ 直推 ${r.directCount} ｜ 团队 ${r.teamTotal}</div>
        <div class="row" style="margin-top:8px;gap:8px">
          <button class="btn sm" data-locate="${r.id}">定位并展开</button>
          <button class="btn sm ghost" data-detail="${r.id}">查看关系信息</button>
        </div>
      </div>`;
    }).join('');
    out.querySelectorAll('[data-locate]').forEach(b=> b.onclick=()=>locateNode(+b.dataset.locate));
    out.querySelectorAll('[data-detail]').forEach(b=> b.onclick=()=>showRelInfo(+b.dataset.detail));
  }catch(e){ out.innerHTML='<div class="card center muted">'+esc(e.message)+'</div>'; }
}

async function locateNode(id){
  let info;
  try{ info=await api('GET','/admin/relation/node/'+id); }catch(e){ toast(e.message); return; }
  const path = [...(info.upline||[]).map(u=>u.id), info.node.id];
  for(const pid of path){
    // 每次定位都重新拉取各级最新下级，确保关系调整后定位结果正确
    try{ const d=await api('GET','/admin/relation/children?userId='+pid); TR.data[pid]=d.children||[]; }
    catch(e){ break; }
    TR.open[pid]=true;
  }
  TR.located=id;
  renderTree();
  showRelInfoFromNode(info);
  setTimeout(()=>{ const el=document.querySelector('.tnode.located'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
}

async function showRelInfo(id){
  let info;
  try{ info=await api('GET','/admin/relation/node/'+id); }catch(e){ toast(e.message); return; }
  showRelInfoFromNode(info);
}
function showRelInfoFromNode(info){
  const box=$('#relInfo'); if(!box) return;
  const n=info.node;
  const up=(info.upline||[]).map(u=>esc(u.email)+' (#'+u.id+')').join(' → ') || '（顶层账号，无上级）';
  box.style.display='block';
  box.innerHTML = `
    <div class="title">关系信息：${esc(n.email)} <span class="tag ${n.status==='ACTIVE'?'approved':n.status==='DISABLED'?'rejected':'pending'}">${USER_STATUS_CN[n.status]||n.status}</span></div>
    <div class="kv"><span class="k">账号ID</span><span class="v">${n.id}</span></div>
    <div class="kv"><span class="k">手机号</span><span class="v">${esc(n.phone)}</span></div>
    <div class="kv"><span class="k">层级(深度)</span><span class="v">${n.depth}</span></div>
    <div class="kv"><span class="k">直推数量</span><span class="v">${n.directCount}</span></div>
    <div class="kv"><span class="k">团队总人数</span><span class="v">${n.teamTotal}</span></div>
    <div class="kv"><span class="k">上级链</span><span class="v">${up}</span></div>`;
}

/* ===================== 启动 ===================== */
if(getAK()){
  A.view='admin';
  render();
  api('GET','/admin/users?status=PENDING').catch(()=>{ clearAK(); A.view='login'; render(); });
}
else { render(); }
</script>
</body>
</html>
